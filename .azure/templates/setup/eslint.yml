steps:
- task: Cache@2
  inputs:
    # package.json, yarn.lock
    # > Dependency change should invalidate the cache
    # eslint.config.mjs, .eslint/**
    # > ESLint rules and configs
    # tsconfig*,json
    # ESLint uses TS config for parsing and type info, could affect the results
    key: >-
      "eslint" | "$(Agent.OS)" | yarn.lock, package.json, eslint.config.mjs, .eslint/**, tsconfig*.json
    path: $(CACHE_DIR_ESLINT)
  displayName: Cache ESLint Results
