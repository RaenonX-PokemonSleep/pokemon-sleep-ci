steps:
- task: UseNode@1
  displayName: 'Use node v26.x'
  inputs:
    version: '26.x'

- task: Cache@2
  displayName: 'Cache Yarn'
  inputs:
    key: 'yarn-2+ | "$(Agent.OS)" | yarn.lock'
    restoreKeys: |
      yarn-2+ | "$(Agent.OS)"
      yarn-2+
    path: $(YARN_CACHE_FOLDER)

- script: npm uninstall --global yarn pnpm
  displayName: 'Remove Global Yarn and pnpm'

- script: npm install --global corepack
  displayName: 'Install Corepack'

- script: corepack enable
  displayName: 'Enable Corepack'

- script: yarn --immutable
  displayName: 'Install Dependencies'
  env:
    YARN_NPM_AUTH_TOKEN: $(GITHUB_PACKAGES_TOKEN_OCR)
